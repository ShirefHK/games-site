<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cube Solver</title><style>:root{--bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3557;--text:#e9ecf8;--muted:#98a1c4;--accent:#6f8cff;--accent2:#8f6bff;--ok:#3ccf8e;--bad:#ff6b6b;--warn:#ffb454;--cs:34px}*{box-sizing:border-box}body,html{height:100%}body{margin:0;color:var(--text);background:radial-gradient(1200px 700px at 20% -10%,#1d2650 0,var(--bg) 60%) fixed,var(--bg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(14,17,32,.75);backdrop-filter:blur(8px)}.brand{font-weight:700;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:10px;margin-right:auto}.logo{width:26px;height:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;background:#05060c;border-radius:6px}.logo i{border-radius:2px}.field{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.field select{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);font-size:14px}.field input[type=range]{width:150px;accent-color:var(--accent)}.field output{min-width:62px;color:var(--text);font-variant-numeric:tabular-nums}main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px 20px 20px;align-items:start}.stage{position:sticky;top:12px;height:calc(100vh - 100px);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:460px;background:radial-gradient(900px 500px at 50% 35%,#232c58 0,#121731 70%)}#view3d{position:absolute;inset:0}#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#gl:active{cursor:grabbing}#hud{position:absolute;left:14px;bottom:12px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-size:13px;color:var(--muted)}#hud b{color:var(--text);font-weight:600}#moveBadge{font:600 22px/1 ui-monospace,Menlo,Consolas,monospace;color:#fff;text-shadow:0 2px 10px #000}#glError{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--warn)}aside.side{display:flex;flex-direction:column;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:8px}.card h2 .n{background:var(--card2);color:var(--text);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;letter-spacing:0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;transition:transform .06s,background .15s,border-color .15s}.btn:hover:not(:disabled){background:#2b3459;border-color:#3b4676}.btn:active:not(:disabled){transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:linear-gradient(135deg,var(--accent),var(--accent2))}.btn.ghost{background:0 0}.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}.btn.icon{padding:7px 11px;min-width:40px;font-size:16px;line-height:1}.mono{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace}.scr{margin-top:10px;background:#10142a;border:1px dashed var(--line);border-radius:10px;padding:9px 11px;min-height:40px;max-height:120px;overflow:auto;font-size:13.5px;color:#d6dcf5;word-spacing:3px}.scr.empty{color:var(--muted);word-spacing:0;font-style:italic}textarea#pasteScr{width:100%;resize:vertical;margin-top:6px;background:#10142a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;min-height:52px}.field select:focus,textarea#pasteScr:focus{outline:2px solid var(--accent);outline-offset:1px}label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}label.chk input{accent-color:var(--accent)}.hint{color:var(--muted);font-size:13px;margin:8px 0 0}.msg{margin-top:8px;font-size:13.5px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}#status{color:var(--muted);font-size:13.5px;margin-top:10px;display:flex;align-items:center;gap:8px}#sol:empty,#solInfo:empty,#status:empty{display:none}.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}#sol{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px;max-height:190px;overflow:auto;padding:2px}.chip{font:600 12.5px ui-monospace,Menlo,Consolas,monospace;background:#10142a;border:1px solid var(--line);color:#cdd4f2;padding:3px 7px;border-radius:7px;cursor:pointer}.chip:hover{border-color:var(--accent)}.chip.done{color:#6b7399;background:#131830}.chip.cur{background:var(--accent);border-color:var(--accent);color:#fff}#solInfo{margin-top:10px;font-size:14px}#solInfo b{color:var(--ok)}.play{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}#viewEdit{position:absolute;inset:0;overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;background:#11162e}.wiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.wiz .txt{flex:1 1 300px;min-width:240px}.wiz .step{font-weight:700;margin-bottom:3px}.wiz .step small{color:var(--muted);font-weight:500;margin-left:6px}.wiz p{margin:0;color:#cdd3ee;font-size:14px}.dots{display:flex;gap:6px;margin-bottom:8px}.dots i{width:26px;height:5px;border-radius:3px;background:var(--line);cursor:pointer}.dots i.on{background:var(--accent)}.dots i.past{background:#4a5a9f}.palette{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{width:52px;height:52px;border-radius:12px;border:3px solid transparent;cursor:pointer;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}.sw.sel{border-color:#fff;transform:scale(1.06)}.sw span{position:absolute;right:-4px;top:-6px;background:#0b0e1d;border:1px solid var(--line);color:var(--text);font-size:11px;border-radius:9px;padding:0 6px;line-height:17px;font-variant-numeric:tabular-nums}.sw span.full{background:var(--ok);color:#05150e;border-color:transparent}.sw span.over{background:var(--bad);color:#fff;border-color:transparent}.sw kbd{position:absolute;left:5px;bottom:3px;font-size:11px;color:rgba(0,0,0,.55);font-weight:700}.netwrap{display:flex;padding:6px 0;overflow-x:auto}.net{margin:0 auto}.net{display:grid;grid-template-columns:repeat(4,auto);grid-template-rows:repeat(3,auto);gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}.face{display:grid;gap:2px;padding:4px;border-radius:8px;background:#05060d;border:2px solid transparent;transition:opacity .15s,border-color .15s}.face.dim{opacity:.38}.face.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(111,140,255,.25)}.face .lab{grid-column:1/-1;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.1em;margin:-2px 0 2px}.cell{width:var(--cs);height:var(--cs);border-radius:5px;border:0;padding:0;background:#3a3f55;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}.cell.empty{background:repeating-linear-gradient(45deg,#2f3550,#2f3550 5px,#373d5c 5px,#373d5c 10px)}.cell.lock{cursor:not-allowed}.cell.lock::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(0,0,0,.45)}.cell.bad{outline:3px solid var(--bad);outline-offset:-1px;animation:pulse 1s ease-in-out infinite;z-index:1}@keyframes pulse{50%{outline-color:#fff}}.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;bottom:-18px;z-index:3;padding:12px 0 14px;margin-top:auto;background:linear-gradient(rgba(17,22,46,0),#11162e 22%)}.editbar .sp{flex:1}#valMsgs{display:flex;flex-direction:column;gap:6px}#valMsgs div{padding:8px 12px;border-radius:9px;font-size:13.5px;border:1px solid}#valMsgs .e{color:#ffc7c7;background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.45)}#valMsgs .o{color:#bff5de;background:rgba(60,207,142,.1);border-color:rgba(60,207,142,.45)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b0e1d;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}.toast.show{opacity:1}[hidden]{display:none!important}@media (max-width:900px){main{grid-template-columns:1fr;padding:12px}.stage{position:relative;top:0;min-height:420px;height:62vh}.stage.editing{height:auto;min-height:0}#viewEdit{padding:10px}.sw{width:44px;height:44px}.palette{gap:8px}.stage.editing #viewEdit{position:relative;inset:auto;overflow:visible}.stage.editing .editbar{position:static;background:0 0;padding:4px 0 0}header.top{padding:10px 12px}.field input[type=range]{width:110px}}.mini{position:absolute;top:12px;right:12px;padding:6px;background:rgba(10,13,28,.72);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(4px);pointer-events:none}.mini .net{gap:4px}.mini .face{padding:2px;gap:1px;border-radius:5px}.mini .face .lab{display:none}.mini .cell{cursor:default;border-radius:2px}.tut{margin-top:10px;background:#10142a;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;color:#cdd3ee;min-height:54px}.tut b{color:#fff}.tbtn{font:600 13px ui-monospace,Menlo,Consolas,monospace;padding:4px 4px 5px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:74px}.tbtn .ticon{display:block;width:66px;height:66px}.tbtn .tname{line-height:1}.tutrow{display:flex;gap:12px;align-items:center}.tutpic{flex:none;width:104px;height:104px;background:#0b0e1d;border-radius:10px;border:1px solid var(--line)}.tbtn.sel{background:var(--accent);border-color:var(--accent);color:#fff}.tsep{flex-basis:100%;height:0}</style></head><body><header class="top"><div class="brand"><span class="logo" aria-hidden="true"><i style="background:#f4f4f4"></i><i style="background:#d3201a"></i><i style="background:#0f9d58"></i><i style="background:#ffd400"></i><i style="background:#ff7b00"></i><i style="background:#1558d6"></i><i style="background:#0f9d58"></i><i style="background:#f4f4f4"></i><i style="background:#d3201a"></i></span>Cube Solver</div><label class="field">Puzzle <select id="puzzle" aria-label="Puzzle"><option value="2">2×2×2</option><option value="d">3×3×2 (Domino)</option><option value="3" selected="selected">3×3×3</option><option value="4">4×4×4</option><option value="5">5×5×5</option><option value="6">6×6×6</option><option value="7">7×7×7</option><option value="S">Skewb</option><option value="P">Pyraminx</option><option value="I">Ivy Cube</option><option value="M">Megaminx</option><option value="F">Fisher Cube</option><option value="W">Windmill Cube</option><option value="A">Axis Cube</option></select></label> <label class="field">Speed <input type="range" id="speed" min="0" max="100" value="42" aria-label="Animation speed"><output id="speedOut">200 ms</output></label></header><main><section class="stage" id="stage"><div id="view3d"><canvas id="gl"></canvas><div id="glError"></div><div class="mini" id="miniBox"><div class="net" id="miniNet" title="Current faces (updates every step)"></div></div><div id="hud"><span id="hudLeft">Drag to rotate · scroll or pinch to zoom</span><span id="moveBadge"></span></div></div><div id="viewEdit" hidden><div class="wiz"><div class="txt"><div class="dots" id="dots"></div><div class="step" id="wizStep"></div><p id="wizHint"></p></div><div class="row"><button class="btn" id="wizPrev">← Back</button> <button class="btn primary" id="wizNext">Next face →</button></div></div><div id="valMsgs"></div><div class="palette" id="palette"></div><div class="netwrap"><div class="net" id="net"></div></div><div class="editbar"><button class="btn small ghost" id="edClear">Clear</button> <button class="btn small ghost" id="edCopy">Copy current 3D cube</button> <span class="sp"></span> <button class="btn" id="edValidate">Check cube</button> <button class="btn" id="edLoad">Load into 3D</button> <button class="btn primary" id="edSolve">Load &amp; solve</button> <button class="btn ghost" id="edBack">Back to 3D</button></div></div></section><aside class="side"><div class="card" id="cardTut"><h2><span class="n">0</span> Learn the moves</h2><p class="hint" style="margin:0 0 8px" id="tutIntro"></p><div id="tutBtns" class="row"></div><div id="tutText" class="tut"></div></div><div class="card"><h2><span class="n">1</span> Scramble</h2><div class="row"><button class="btn primary" id="btnScramble">Scramble</button> <button class="btn" id="btnReset">Reset to solved</button> <label class="chk"><input type="checkbox" id="animScr"> animate</label></div><div class="scr mono empty" id="scrText">No scramble yet</div><textarea id="pasteScr" class="mono" spellcheck="false" placeholder="…or paste your own scramble, e.g.  R U R' U' F2 D L'"></textarea><div class="row" style="margin-top:8px"><button class="btn small" id="btnApplyScr">Apply scramble</button><span class="hint" style="margin:0" id="scrHint"></span></div><div class="msg err" id="scrMsg"></div></div><div class="card"><h2><span class="n">2</span> Your real cube</h2><div class="row"><button class="btn" id="btnEnter">Enter my cube…</button></div><p class="hint">Paint your cube’s colours face by face on a flat map: left-click paints, right-click clears a sticker. A guided wizard and automatic checks help.</p></div><div class="card"><h2><span class="n">3</span> Solve</h2><div class="row"><button class="btn primary" id="btnSolve">Solve</button> <button class="btn" id="btnCancel" hidden>Cancel</button></div><div id="status"></div><div id="solInfo"></div><div class="play" id="play" hidden><button class="btn icon" id="pRestart" title="Back to start">⏮</button> <button class="btn icon" id="pPrev" title="Step back">◀</button> <button class="btn icon primary" id="pPlay" title="Play / pause">▶</button> <button class="btn icon" id="pNext" title="Step forward">▶|</button> <button class="btn icon" id="pEnd" title="Skip to the end">⏭</button> <button class="btn small ghost" id="btnCopy" title="Copy the moves as text">Copy moves</button></div><div id="sol" class="mono"></div></div></aside></main><div class="toast" id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script type="text/plain" id="src-core">/* ===== core: cube geometry, moves, notation (shared by UI and worker) ===== */
var FACE_NAMES = ['U', 'R', 'F', 'D', 'L', 'B'];
var FACE_AXIS = [1, 0, 2, 1, 0, 2];
var FACE_DIR = [1, 1, 1, -1, -1, -1];
var NORMALS = [[0, 1, 0], [1, 0, 0], [0, 0, 1], [0, -1, 0], [-1, 0, 0], [0, 0, -1]];
/* corners: URF UFL ULB UBR DFR DLF DBL DRB (faces listed clockwise, U/D first) */
var CORNER_FACES = [[0, 1, 2], [0, 2, 4], [0, 4, 5], [0, 5, 1], [3, 2, 1], [3, 4, 2], [3, 5, 4], [3, 1, 5]];
/* edges: UR UF UL UB DR DF DL DB FR FL BL BR */
var EDGE_FACES = [[0, 1], [0, 2], [0, 4], [0, 5], [3, 1], [3, 2], [3, 4], [3, 5], [2, 1], [2, 4], [5, 4], [5, 1]];

function faceOfNormal(n) {
  if (n[1] === 1) return 0; if (n[0] === 1) return 1; if (n[2] === 1) return 2;
  if (n[1] === -1) return 3; if (n[0] === -1) return 4; return 5;
}

function rotVec(axis, v, q) {
  q = ((q % 4) + 4) % 4;
  var x = v[0], y = v[1], z = v[2], t;
  for (var i = 0; i < q; i++) {
    if (axis === 0) { t = y; y = z; z = -t; }
    else if (axis === 1) { t = x; x = -z; z = t; }
    else { t = x; x = y; y = -t; }
  }
  return [x, y, z];
}

function makeGeo(nx, ny, nz) {
  var g = { nx: nx, ny: ny, nz: nz, dims: [nx, ny, nz] };
  g.rows = [nz, ny, ny, nz, ny, ny];
  g.cols = [nx, nz, nx, nx, nz, nx];
  g.off = []; var tot = 0;
  for (var f = 0; f < 6; f++) { g.off[f] = tot; tot += g.rows[f] * g.cols[f]; }
  g.count = tot;
  g.px = new Int16Array(tot); g.py = new Int16Array(tot); g.pz = new Int16Array(tot);
  g.face = new Uint8Array(tot);
  g.lut = new Int16Array(40 * 40 * 40 * 6).fill(-1);
  function key(x, y, z, f) { return (((x + 16) * 40 + (y + 16)) * 40 + (z + 16)) * 6 + f; }
  g.at = function (x, y, z, f) { return g.lut[key(x, y, z, f)]; };
  for (f = 0; f < 6; f++) {
    for (var r = 0; r < g.rows[f]; r++) for (var c = 0; c < g.cols[f]; c++) {
      var x, y, z;
      if (f === 0) { y = ny - 1; x = 2 * c - (nx - 1); z = 2 * r - (nz - 1); }
      else if (f === 1) { x = nx - 1; z = (nz - 1) - 2 * c; y = (ny - 1) - 2 * r; }
      else if (f === 2) { z = nz - 1; x = 2 * c - (nx - 1); y = (ny - 1) - 2 * r; }
      else if (f === 3) { y = -(ny - 1); x = 2 * c - (nx - 1); z = (nz - 1) - 2 * r; }
      else if (f === 4) { x = -(nx - 1); z = 2 * c - (nz - 1); y = (ny - 1) - 2 * r; }
      else { z = -(nz - 1); x = (nx - 1) - 2 * c; y = (ny - 1) - 2 * r; }
      var i = g.off[f] + r * g.cols[f] + c;
      g.px[i] = x; g.py[i] = y; g.pz[i] = z; g.face[i] = f;
      g.lut[key(x, y, z, f)] = i;
    }
  }
  g.moveCache = {};
  /* gather permutation: new[i] = old[p[i]] ; returns null when the turn is geometrically impossible */
  g.movePerm = function (axis, lo, hi, q) {
    q = ((q % 4) + 4) % 4;
    var p = new Int32Array(g.count);
    for (var i = 0; i < g.count; i++) p[i] = i;
    if (!q) return p;
    var o = [0, 1, 2].filter(function (a) { return a !== axis; });
    if (q % 2 && g.dims[o[0]] !== g.dims[o[1]]) return null;
    for (i = 0; i < g.count; i++) {
      var c = [g.px[i], g.py[i], g.pz[i]];
      var li = (c[axis] + g.dims[axis] - 1) / 2;
      if (li < lo || li > hi) continue;
      var np = rotVec(axis, c, q), nn = rotVec(axis, NORMALS[g.face[i]], q);
      var d = g.at(np[0], np[1], np[2], faceOfNormal(nn));
      p[d] = i;
    }
    return p;
  };
  return g;
}

var MOVE_RE = /^(\d+)?([URFDLBurfdlbxyzMES])(w)?(2'|'2|2|')?$/;

/* parse a move token into {axis,lo,hi,q,perm,token}; null if not valid for this puzzle */
function parseMove(g, tok) {
  if (g.moveCache.hasOwnProperty(tok)) return g.moveCache[tok];
  if (g.poly) return null;
  var res = null;
  var m = MOVE_RE.exec(tok);
  if (m) {
    var k = m[1] ? parseInt(m[1], 10) : 0, L = m[2], wide = !!m[3], suf = m[4] || '';
    var q = suf === "'" ? 3 : (suf ? 2 : 1);
    var axis, lo, hi, qq, n, ok = true;
    if (L === 'x' || L === 'y' || L === 'z') {
      axis = 'xyz'.indexOf(L); n = g.dims[axis]; lo = 0; hi = n - 1; qq = q;
    } else if (L === 'M' || L === 'E' || L === 'S') {
      axis = L === 'M' ? 0 : (L === 'E' ? 1 : 2); n = g.dims[axis];
      if (n % 2 === 0) ok = false;
      lo = hi = (n - 1) / 2; qq = (L === 'S') ? q : (4 - q) % 4;
    } else {
      var lower = L === L.toLowerCase();
      var f = FACE_NAMES.indexOf(L.toUpperCase());
      axis = FACE_AXIS[f]; n = g.dims[axis];
      var w = 1, d0 = 0;
      if (lower || wide) { w = k || 2; d0 = 0; }
      else if (k) { w = 1; d0 = k - 1; }
      if (d0 + w > n || (k && k < 1)) ok = false;
      if (FACE_DIR[f] > 0) { hi = n - 1 - d0; lo = hi - w + 1; qq = q; }
      else { lo = d0; hi = d0 + w - 1; qq = (4 - q) % 4; }
    }
    if (ok) {
      var perm = g.movePerm(axis, lo, hi, qq);
      if (perm) res = { axis: axis, lo: lo, hi: hi, q: qq, perm: perm, token: tok };
    }
  }
  g.moveCache[tok] = res;
  return res;
}

function applyPerm(state, p) {
  var tmp = new Uint8Array(state.length);
  for (var i = 0; i < p.length; i++) tmp[i] = state[p[i]];
  state.set(tmp);
}
function applyMoves(g, state, toks) {
  for (var i = 0; i < toks.length; i++) {
    var mv = parseMove(g, toks[i]);
    if (!mv) throw new Error('Illegal move for this puzzle: ' + toks[i]);
    applyPerm(state, mv.perm);
  }
}
function invertToken(t) {
  if (/2'?$|'2$/.test(t)) return t.replace(/'/g, '');
