<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sherif Hossam – Portfolio, Games &amp; Puzzles</title>
<meta name="description" content="Sherif Hossam – Unity / C# developer. Portfolio demos, 70 classic games and a 3D cube solver.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Preahvihear&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0518;--panel:#1a0b2e;--panel-h:#130428;--raised:#251043;--line:#07020f;--edge:#4f228d;--ink:#ccd6f6;--dim:#9a93b8;--accent:#a362ff;--accent-bg:#4f228d;--ok:#7ee0b0;--warn:#e5b645;--glow:rgba(118,60,172,.35);
--b:'Poppins',system-ui,sans-serif;--h:'Preahvihear','Poppins',sans-serif;--m:'IBM Plex Mono',ui-monospace,Consolas,monospace}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#efe9fa;--panel:#f7f3fd;--panel-h:#e3d9f5;--raised:#fff;--line:#b9a6df;--edge:#cbb9ee;--ink:#1a0b2e;--dim:#5b4c80;--accent:#6a2fc7;--accent-bg:#6a2fc7;--ok:#1f7a55;--warn:#9a6a00;--glow:rgba(163,98,255,.25)}}
:root[data-theme=light]{--bg:#efe9fa;--panel:#f7f3fd;--panel-h:#e3d9f5;--raised:#fff;--line:#b9a6df;--edge:#cbb9ee;--ink:#1a0b2e;--dim:#5b4c80;--accent:#6a2fc7;--accent-bg:#6a2fc7;--ok:#1f7a55;--warn:#9a6a00;--glow:rgba(163,98,255,.25)}
:root[data-theme=dark]{--bg:#0d0518;--panel:#1a0b2e;--panel-h:#130428;--raised:#251043;--line:#07020f;--edge:#4f228d;--ink:#ccd6f6;--dim:#9a93b8;--accent:#a362ff;--accent-bg:#4f228d;--ok:#7ee0b0;--warn:#e5b645;--glow:rgba(118,60,172,.35);
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(600px 420px at 18% 8%,var(--glow),transparent 70%),radial-gradient(700px 500px at 85% 45%,var(--glow),transparent 70%),radial-gradient(600px 450px at 20% 85%,var(--glow),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:13px/1.5 var(--b);padding-bottom:34px}
a{color:inherit;text-decoration:none}
/* title / menu bar */
.menubar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:2px;background:var(--panel-h);border-bottom:1px solid var(--line);padding:0 8px;height:34px;font-size:12.5px;overflow-x:auto;white-space:nowrap}
.menubar .logo{font-family:var(--m);font-weight:600;color:var(--accent);margin-right:10px}
.menubar a,.menubar button{padding:5px 10px;border-radius:3px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.menubar a:hover,.menubar button:hover{background:var(--raised)}
.menubar .sp{flex:1}.menubar .scene{font-family:var(--m);color:var(--dim);font-size:11.5px;margin-right:8px}
.wrap{max-width:1240px;margin:0 auto;padding:12px}
/* panels */
.panel{background:linear-gradient(137deg,var(--panel-h),var(--panel));border:1px solid var(--line);border-radius:3px;margin-bottom:12px;scroll-margin-top:46px;box-shadow:inset 0 0 0 1px var(--edge)}
.tabs{display:flex;align-items:stretch;background:var(--panel-h);border-bottom:1px solid var(--line);min-height:28px}
.tab{font-family:var(--h);font-size:13px;padding:5px 14px;border-top:2px solid var(--accent);background:var(--panel);display:flex;align-items:center;gap:7px}
.tab i{font-style:normal;color:var(--accent)}
.tabs .info{margin-left:auto;padding:5px 12px;font-family:var(--m);font-size:11px;color:var(--dim)}
.body{padding:14px}
/* hero / inspector */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.avatar{width:88px;height:88px;border-radius:6px;background:linear-gradient(135deg,var(--accent-bg),var(--raised));border:1px solid var(--edge);display:grid;place-items:center;font:600 34px var(--m);color:var(--accent)}
h1{margin:0;font-family:var(--h);font-size:clamp(28px,5.5vw,46px);font-weight:400;letter-spacing:-.01em;line-height:1.1}
.role{font-family:var(--m);font-size:12px;color:var(--ok);margin:4px 0 8px}
.bio{margin:0 0 12px;color:var(--dim);max-width:680px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:3px;border:1px solid var(--edge);background:var(--raised);font-size:12.5px}
.btn:hover{border-color:var(--accent)}.btn.pri{background:linear-gradient(135deg,#7127ba,#4f228d);border-color:var(--accent);color:#fff;box-shadow:0 0 14px var(--glow)}
.btn svg{width:15px;height:15px;fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.stat{background:var(--panel-h);border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-family:var(--m)}
.stat b{display:block;font-size:20px;color:var(--accent);font-weight:600}.stat span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
/* inspector component cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.comp{background:linear-gradient(168deg,var(--panel-h),var(--raised));border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;transition:border-color .12s}
.comp:hover{border-color:var(--accent)}
.comp-h{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--raised);border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px}
.comp-h .chk{width:12px;height:12px;border:1px solid var(--accent);background:var(--accent-bg);border-radius:2px}
.comp-h small{margin-left:auto;font:400 10.5px var(--m);color:var(--dim)}
.prop{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:5px 10px;font-size:12px;border-bottom:1px solid var(--line)}
.prop:last-of-type{border-bottom:0}.prop dt{color:var(--dim)}.prop dd{margin:0;font-family:var(--m);font-size:11.5px;word-break:break-word}
.result{padding:8px 10px 10px;margin-top:auto;border-top:1px solid var(--line)}
.num{font:600 22px var(--m);color:var(--warn)}.lab{color:var(--dim);font-size:12px;margin-top:2px}
.run{display:block;padding:7px;text-align:center;background:var(--accent-bg);font:600 11.5px var(--m);text-transform:uppercase;letter-spacing:.05em;color:#fff}
.run:hover{background:var(--accent)}
/* project asset browser */
.tools{display:flex;gap:8px;padding:8px 10px;background:var(--panel-h);border-bottom:1px solid var(--line);align-items:center}
.tools label{font-family:var(--m);color:var(--dim);font-size:11px}
input[type=search]{flex:1;min-width:140px;padding:5px 9px;border-radius:3px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);font:12.5px var(--b)}
input[type=search]:focus{outline:1px solid var(--accent)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.asset{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 4px;border:1px solid transparent;border-radius:3px}
.asset:hover{background:var(--raised);border-color:var(--accent)}
.thumb{width:64px;height:64px;border-radius:5px;display:grid;place-items:center;font:600 22px var(--m);color:#fff;margin-bottom:6px;border:1px solid rgba(0,0,0,.4);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.asset .t{font-size:11.5px;line-height:1.25;word-break:break-word}
.asset .n{font:10px var(--m);color:var(--dim)}
.empty{color:var(--dim);font-family:var(--m);padding:16px}
/* console + status */
.console{font-family:var(--m);font-size:11.5px;max-height:150px;overflow:auto;padding:8px 12px;background:var(--panel-h)}
.console div{padding:1px 0;white-space:pre-wrap}.console .t{color:var(--dim)}.console .i{color:var(--accent)}.console .w{color:var(--warn)}.console .o{color:var(--ok)}
.status{position:fixed;left:0;right:0;bottom:0;height:26px;background:var(--panel-h);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font:11px var(--m);color:var(--dim);z-index:10;overflow:hidden;white-space:nowrap}
.status a{color:var(--accent)}.status .sp{flex:1}
@media(max-width:560px){.hero{grid-template-columns:1fr}.avatar{width:64px;height:64px;font-size:24px}}
</style>
</head>
<body>
<div class="menubar" id="menu"></div>

<div class="wrap">
  <section class="panel" id="top">
    <div class="tabs"><div class="tab"><i>◆</i> Inspector</div><div class="info" id="sceneInfo"></div></div>
    <div class="body">
      <div class="hero">
        <div class="avatar" id="avatar"></div>
        <div>
          <h1 id="name"></h1>
          <div class="role" id="role"></div>
          <p class="bio" id="bio"></p>
          <div class="btns" id="links"></div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section class="panel" id="demos">
    <div class="tabs"><div class="tab"><i>▣</i> Hierarchy · Portfolio Demos</div><div class="info" id="demoInfo"></div></div>
    <div class="body"><div class="grid" id="demoGrid"></div></div>
  </section>

  <section class="panel" id="games">
    <div class="tabs"><div class="tab"><i>▤</i> Project · Games</div><div class="info" id="gamesSub"></div></div>
    <div class="tools"><label for="q">🔍</label><input type="search" id="q" placeholder="Search assets…" aria-label="Search games"></div>
    <div class="body"><div class="assets" id="gameGrid"></div></div>
  </section>

  <section class="panel" id="puzzles">
    <div class="tabs"><div class="tab"><i>⬡</i> Project · Puzzles</div></div>
    <div class="body"><div class="assets" id="toolGrid"></div></div>
  </section>

  <section class="panel" id="console">
    <div class="tabs"><div class="tab"><i>≡</i> Console</div><div class="info"><a href="#" id="clr">Clear</a></div></div>
    <div class="console" id="log"></div>
  </section>
</div>

<div class="status" id="status"></div>

<script>
const PROFILE={
  name:'Sherif Hossam',
  role:'Unity / C# Developer · Cairo, Egypt',
  bio:'Ten years of CV bullets turned back into working code — plus a collection of classic games and puzzles I keep playable in the browser.',
  github:'https://github.com/ShirefHK',
  githubUser:'ShirefHK',
  since:2013
};
const DEMOS=[
 {file:'mesh-weight',co:'PlanRadar · BIM Viewer',title:'Mesh Weight',years:'Dec 2021 – Present',num:'−92%',lab:'GPU-instanced batched loading cut mesh memory on the heaviest models from 3.56 GB to 272.5 MB.'},
 {file:'block-runner',co:'BE-STEAM · WRO Simulator',title:'Block Runner',years:'Mar 2020 – Dec 2021',num:'Blocks→Script',lab:'Drag-and-drop blocks compile to Python-style script and drive a robot through a scored mission grid.'},
 {file:'room-fit',co:'Elibre DMCC · VR/AR Pipeline',title:'Room Fit',years:'Oct 2017 – May 2021',num:'Auto-Fit',lab:"A greedy space-fitting engine lays out furniture against a room's real dimensions and skips what won't fit."},
 {file:'talk-loop',co:'INTDV · AI Chatbot Avatar',title:'Talk Loop',years:'Aug – Oct 2021',num:'STT → TTS',lab:'Speech-to-text into a backend, IBM Watson TTS back out, synced to facial/mouth animation via SALSA.'},
 {file:'exposure-room',co:'Arabtesting · Therapeutic VR',title:'Exposure Room',years:'Jul – Oct 2019',num:'Self-Paced',lab:'Graduated exposure-therapy scenarios for acrophobia and claustrophobia, plus dyslexia support tools.'},
 {file:'shop-sync',co:'Arab Builders · Simulation of City',title:'Shop Sync',years:'Dec 2016 – Oct 2017',num:'N↔N',lab:'A Node.js multiplayer server synced every connected shopper in a live 3D world over a socket API.'},
 {file:'rig-console',co:'Tronixs Egypt · Drilling Rig Sim',title:'Rig Console',years:'Sep 2016 – Feb 2017',num:'Dual-Stick',lab:"Hardware-accurate driller's chair controls and mud-tank monitoring, with a live instructor station."},
 {file:'advergame-set',co:'Freelancer.com · Contract Work',title:'Advergame Set',years:'May 2013 – Oct 2016',num:'3+ yrs',lab:'Educational mini-games and promotional advergames delivered for international clients.'}
];
const GAMES=['01 Tetris','02 Doodle Jump','03 Arkanoid','04 Snake','05 Minesweeper','06 Fifteen-Puzzle','07 Racing (Top Down)','08 Outrun','09 Xonix','10 Bejeweled','11 NetWalk (Pipe Puzzle)','12 Mahjong Solitaire','13 Tron','14 Chess','15 Volleyball','16 Asteroids','17 Tetris Attack','18 SameGame','19 Cogs','20 SquareLogic','21 Bookworm','22 Picross','23 SpaceChem','24 Sokoban','25 2048','26 4-to-Win','27 Reversi','28 Strike5','29 Pitfall','30 Gridlock','31 Trio','32 Gridwords','33 Quadwords','34 Quintext','35 Crosstext','36 Quiz','37 Sudoku','38 Sudoku Mini','39 Sudoku Kika','40 Sudoku Extra','41 Sudoku Farb','42 Sudoku Rainbow','43 Sudoku Diagonal','44 Killer Sudoku','45 Killer Sudoku Kika','46 Killer Sudoku Farb','47 Killer Sudoku Diagonal','48 Kropki Sudoku','49 Comparison Sudoku','50 Arukone','51 Battleships','52 Binary Puzzle','53 Chiiki','54 Dampfross','55 Dominosteine','56 Endview','57 Galaxien','58 Hidoku','59 Kakuro','60 Kendoku','61 Knossos','62 Kuhweide','63 Loopy','64 Pfeile','65 Rohre','66 Shikaku','67 Slitherlink','68 Squaring','69 Squiggly','70 Sterne'];
const TOOLS=[{href:'cube-solver/',icon:'🧊',title:'Cube Solver',desc:'3D puzzle solver: cubes, Megaminx, Pyraminx and more'}];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GH='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const initials=s=>s.replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function log(msg,cls='i'){
  const d=document.createElement('div'),t=new Date().toLocaleTimeString([], {hour12:false});
  d.innerHTML=`<span class="t">[${t}]</span> <span class="${cls}">${esc(msg)}</span>`;
  $('log').appendChild(d);$('log').scrollTop=1e9;
  $('status').querySelector('.last')&&($('status').querySelector('.last').textContent=msg);
}
function renderProfile(){
  const yr=new Date().getFullYear();
  document.title=PROFILE.name+' – Portfolio, Games & Puzzles';
  $('avatar').textContent=initials(PROFILE.name);
  $('name').textContent=PROFILE.name;
  $('role').textContent='// '+PROFILE.role;
  $('bio').textContent=PROFILE.bio;
  $('sceneInfo').textContent=`Portfolio.scene · ${DEMOS.length+GAMES.length+TOOLS.length} objects`;
  $('links').innerHTML=
    `<a class="btn pri" href="${PROFILE.github}" target="_blank" rel="noopener">${GH} GitHub: @${esc(PROFILE.githubUser)}</a>`+
    `<a class="btn" href="#demos">▶ Run demos</a><a class="btn" href="#games">🎮 Play games</a>`;
  $('stats').innerHTML=[[DEMOS.length,'Portfolio demos'],[GAMES.length,'Games'],[TOOLS.length,'Puzzle tools'],[`${PROFILE.since}–${yr}`,'Career span']]
    .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('menu').innerHTML=`<span class="logo">◆ SH.engine</span>`+
    [['#top','File'],['#demos','Demos'],['#games','Games'],['#puzzles','Puzzles'],['#console','Console']].map(([h,t])=>`<a href="${h}">${t}</a>`).join('')+
    `<span class="sp"></span><span class="scene">Portfolio.scene*</span><a href="${PROFILE.github}" target="_blank" rel="noopener">GitHub ↗</a><button id="theme" type="button" aria-label="Toggle theme">◐ Layout</button>`;
  $('status').innerHTML=`<span class="last">Ready</span><span class="sp"></span><span>${esc(PROFILE.name)}</span><a href="${PROFILE.github}" target="_blank" rel="noopener">github.com/${esc(PROFILE.githubUser)}</a><span>© ${yr}</span>`;
}
function renderDemos(){
  $('demoInfo').textContent=`${DEMOS.length} scripts`;
  $('demoGrid').innerHTML=DEMOS.map(d=>`<div class="comp"><div class="comp-h"><span class="chk"></span>${esc(d.title)} (Script)<small>${esc(d.file)}.html</small></div>
    <dl style="margin:0"><div class="prop"><dt>Company</dt><dd>${esc(d.co)}</dd></div><div class="prop"><dt>Period</dt><dd>${esc(d.years)}</dd></div></dl>
    <div class="result"><div class="num">${esc(d.num)}</div><div class="lab">${esc(d.lab)}</div></div>
    <a class="run" data-log="Loading demo: ${esc(d.title)}" href="demos/${d.file}.html">▶ Play</a></div>`).join('');
}
const GAME_LIST=GAMES.map(f=>{const m=f.match(/^(\d+)\s+(.*)$/);return{folder:f,num:m?m[1]:'',title:m?m[2]:f}});
function renderGames(filter=''){
  const f=filter.trim().toLowerCase();
  const list=GAME_LIST.filter(g=>!f||g.title.toLowerCase().includes(f)||g.num===f);
  $('gamesSub').textContent=f?`${list.length} / ${GAME_LIST.length} assets`:`${GAME_LIST.length} assets`;
  $('gameGrid').innerHTML=list.length?list.map(g=>`<a class="asset" data-log="Loading game: ${esc(g.title)}" href="games/${encodeURIComponent(g.folder)}/"><div class="thumb" style="background:hsl(${hue(g.title)} 45% 38%)">${esc(initials(g.title))}</div><div class="t">${esc(g.title)}</div><div class="n">#${esc(g.num)}</div></a>`).join(''):'<div class="empty">No assets match the search.</div>';
}
function renderTools(){
  $('toolGrid').innerHTML=TOOLS.map(t=>`<a class="asset" data-log="Loading tool: ${esc(t.title)}" href="${t.href}" title="${esc(t.desc)}"><div class="thumb" style="background:hsl(${hue(t.title)} 45% 38%);font-size:30px">${t.icon}</div><div class="t">${esc(t.title)}</div><div class="n">${esc(t.desc)}</div></a>`).join('');
}
function initTheme(){
  try{const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s}catch(e){}
  $('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;const n=dark?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}log('Editor layout: '+n,'w')};
}
renderProfile();renderDemos();renderGames();renderTools();initTheme();
log('Domain reload complete.','o');
log(`Loaded ${DEMOS.length} demos, ${GAMES.length} games, ${TOOLS.length} puzzle tool(s).`);
log(`Welcome, ${PROFILE.name}. github.com/${PROFILE.githubUser}`,'o');
$('q').addEventListener('input',e=>renderGames(e.target.value));
$('clr').onclick=e=>{e.preventDefault();$('log').innerHTML=''};
document.addEventListener('click',e=>{const a=e.target.closest('[data-log]');if(a)log(a.dataset.log+'…')});
</script>
</body>
</html>
